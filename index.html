<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Sets html.js before the stylesheet is applied, so scroll-reveal elements
     start hidden on the very first paint instead of flashing and then being
     hidden once the module boots. If scripting is off this never runs and
     every .reveal simply stays visible - see the .reveal rules.

     The timer is the fail-safe for the other way this can break. `.js` is
     what hides every .reveal until it scrolls in, and ONLY initMotion()
     (assets/js/ui.js, called from boot()) ever un-hides them. If that module
     doesn't run - syntax error, blocked script, dead network, an exception
     earlier in boot() - nothing would ever remove the hidden state and the
     entire page would sit at opacity 0. app.js shipped with an unbalanced
     brace once already, so this is not hypothetical. If nothing has claimed
     the motion layer a few seconds in, fall back to the scripting-off
     styling, where .reveal is plainly visible. -->
<script>
  (function () {
    var d = document.documentElement
    d.classList.add('js')
    setTimeout(function () {
      if (d.classList.contains('js-motion')) return   // initMotion() ran; all good
      d.classList.remove('js')
      d.dataset.motionFailed = '1'                    // stops a very late boot re-hiding everything
    }, 3000)
  })()
</script>
